# Generate the Xcode project with:  cd iOS && xcodegen
# Set PASTEHUB_TEAM_ID to your Apple developer team ID before generating to sign for a device.
name: PasteHub-iOS
options:
  bundleIdPrefix: com.kaitaocao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${PASTEHUB_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PasteHub:
    path: ..
targets:
  # Named apart from the macOS package's "PasteHub" scheme; the product is still PasteHub.app.
  PasteHubPhone:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../AppSupport/Assets/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: PasteHub
        product: PasteHubCore
      - target: PasteHubKeyboard
      - target: PasteHubShare
    entitlements:
      path: App/PasteHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaitaocao.PasteHub
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PasteHub
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaitaocao.PasteHub.ios
        PRODUCT_NAME: PasteHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PasteHubKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    dependencies:
      - package: PasteHub
        product: PasteHubCore
    entitlements:
      path: Keyboard/PasteHubKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaitaocao.PasteHub
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: PasteHub
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaitaocao.PasteHub.ios.keyboard

  PasteHubShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
    dependencies:
      - package: PasteHub
        product: PasteHubCore
    entitlements:
      path: Share/PasteHubShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kaitaocao.PasteHub
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: PasteHub
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaitaocao.PasteHub.ios.share
